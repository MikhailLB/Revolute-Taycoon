# Rust workspace for Revolute Taycoon.
# The economic simulation, finance/tax math and anti-tamper logic live here and
# are compiled into a static library linked by the Swift app over a C FFI.

[workspace]
resolver = "2"
members = ["engine"]

[profile.release]
# The engine runs the whole simulation and serializes a fresh snapshot several
# times per second, and decodes the catalog on game entry — this is a compute
# path, not dead weight, so optimize it for speed. (`opt-level = "z"` here made
# both the per-tick step and the catalog build measurably slower.)
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
