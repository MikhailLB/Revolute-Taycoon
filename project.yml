name: RevoluteTycoon
options:
  bundleIdPrefix: com.revolute
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "5.0"
targets:
  RevoluteTycoon:
    type: application
    platform: iOS
    sources:
      - path: RevoluteTycoon
    preBuildScripts:
      - name: Build Rust engine
        script: '"${PROJECT_DIR}/scripts/build_rust.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/rust/target/xcode/$(PLATFORM_NAME)/libtaycoon_engine.a
    settings:
      base:
        PRODUCT_NAME: RevoluteTycoon
        PRODUCT_BUNDLE_IDENTIFIER: com.taycoon.revolute
        INFOPLIST_FILE: RevoluteTycoon/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: RevoluteTycoon/Bridge/RevoluteTycoon-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/rust/target/xcode/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -ltaycoon_engine
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 48UP4UDWV7
        DEAD_CODE_STRIPPING: YES
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          DEPLOYMENT_POSTPROCESSING: YES
          SWIFT_OPTIMIZATION_LEVEL: -O
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
